[project]
name = "lang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gvemuru1", email = "gurucharanvemuru@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "pip>=26.2.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lang = "lang:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
